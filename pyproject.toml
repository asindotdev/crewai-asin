[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "crewai-asin"
version = "0.1.0"
description = "CrewAI tools for Asin: search Amazon, read a product's price history and compare its sellers' offers."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Asin", email = "contact@asin.dev" },
]
keywords = ["crewai", "asin", "tools", "agents", "amazon", "price-tracking", "ecommerce", "asin", "price-history"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "crewai>=0.150",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://www.asin.dev"
Documentation = "https://github.com/asindotdev/crewai-asin#readme"
Repository = "https://github.com/asindotdev/crewai-asin"
Issues = "https://github.com/asindotdev/crewai-asin/issues"

[tool.crewai]
type = "tool"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_asin"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
